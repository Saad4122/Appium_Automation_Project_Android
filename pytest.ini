[pytest]
testpaths = testcases
pythonpath = .
addopts = --strict-markers -ra
markers =
    critical: Critical priority test cases
    highest: Highest priority test cases
    medium: Medium priority test cases
    android: Android mobile platform tests
    state_changing: Tests that modify remote account or server state
    consumable: Tests that consume finite test data or limits
    smoke: Quick sanity check tests
    regression: Comprehensive regression suite
    auth: Authentication and session verification
    pre_signin: Pre-login journeys and services
    dashboard: Dashboard and navigation tests
    payments: Payments and fund transfer flows
    accounts: Account services and statements
    side_menu: Side navigation drawer features
    account_opening: Digital onboarding flows
    services: Value added services
